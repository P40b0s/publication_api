[package]
name = "publication-client"
version = "0.1.5"
edition = "2024"

[dependencies]
utilites = {git = "https://github.com/P40b0s/help_utilites.git", package = "utilites"}
scraper="0.27.0"
thiserror="2.0.18"
anyhow="1.0.71"
serde_json = "1.0.149"
urlencoding="2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
tokio= {version = "1.52.2", features = ["macros", "rt", "rt-multi-thread", "bytes"] }
reqwest = { version = "0.13.3", features = ["json", "gzip", "brotli", "deflate", "stream"] }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
sha256 = "1.6.0"
bytes = "1.11.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
